# Motion NXlogs of LoKI beamstop axes and the detector carriage are empty.
#
# The file-writer configuration used a source name with a "TODO-" prefix for
# `<component>/transformations/motion`, so no values were written. The motor
# readback (RBV) was written to the NXlog `<component>/value` instead.
# This patch replaces each empty `motion` log by the readback log and copies the
# transformation attributes of the original `motion` log.
#
# Observed in run 336349 (2026-10-07).

[[op]]
kind = "remove"
path = "/entry/instrument/beamstop_x/transformations/motion"

[[op]]
kind = "move"
source = "/entry/instrument/beamstop_x/value"
target = "/entry/instrument/beamstop_x/transformations/motion"

[[op]]
kind = "set_attrs"
path = "/entry/instrument/beamstop_x/transformations/motion"
attrs = { depends_on = "/entry/instrument/beamstop_x/transformations/distance", transformation_type = "translation", vector = [0.0, 0.0, 1.0] }

[[op]]
kind = "remove"
path = "/entry/instrument/beamstop_y/transformations/motion"

[[op]]
kind = "move"
source = "/entry/instrument/beamstop_y/value"
target = "/entry/instrument/beamstop_y/transformations/motion"

[[op]]
kind = "set_attrs"
path = "/entry/instrument/beamstop_y/transformations/motion"
attrs = { depends_on = "/entry/instrument/beamstop_x/transformations/motion", transformation_type = "translation", vector = [1.0, 0.0, 0.0], offset = [0.0, 0.0, 0.0], offset_units = "m" }

